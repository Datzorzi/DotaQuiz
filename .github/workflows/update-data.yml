name: Atualizar dados do Dota

# Roda o pipeline contra as fontes oficiais e commita se algo mudou.
# O commit dispara o Deploy sozinho, então o site acompanha o patch sem
# ninguém precisar mexer.

on:
  schedule:
    - cron: '17 6 * * *' # todo dia, 06:17 UTC
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Gerar dados
        run: node scripts/build-data.mjs --fresh

      - name: Commitar se mudou
        run: |
          if git diff --quiet -- public/data; then
            echo "Nada novo: dados já estão no patch atual."
            exit 0
          fi
          patch=$(node -p "require('./public/data/index.json').patch")
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/data
          git commit -m "dados: atualiza para o patch $patch"
          git push
